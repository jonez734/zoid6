# Managed by zoid6 (make -C zoid6/src install-pgsql). Appended to:
#   /var/lib/pgsql/18/data/pg_ident.conf
# Maps the zoid6 OS account to the daemon's database login. The identd server on the client
# host reports the connecting OS user; this map says which database role that user becomes.
#
# Format: MAPNAME  SYSTEM-USERNAME  PG-USERNAME
zoidmap  zoid6  bed_zoid6
