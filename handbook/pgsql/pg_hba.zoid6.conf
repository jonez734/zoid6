# Managed by zoid6 (make -C zoid6/src install-pgsql). Appended to:
#   /var/lib/pgsql/18/data/pg_hba.conf
# Lets the daemon's login connect over TCP from this host, authenticated by identd through the
# zoidmap above. It must sit above any broader rule for database zoid6, because pg_hba.conf is
# read top to bottom and the first match wins.
#
# TYPE  DATABASE  USER        ADDRESS          METHOD  OPTIONS
host    zoid6     bed_zoid6   127.0.0.1/32     ident   map=zoidmap
