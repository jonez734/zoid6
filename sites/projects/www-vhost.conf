# Apache vhost for projects.zoidtechnologies.com
# STAGED - deploy via zoid6/sites/projects/Makefile
#
# Copy to: /etc/apache2/sites-available/projects.zoidtechnologies.com.conf
# Enable:  a2ensite projects.zoidtechnologies.com

<VirtualHost *:80>
    ServerName projects.zoidtechnologies.com
    DocumentRoot "/srv/www/vhosts/projects.zoidtechnologies.com/html/"

    <IfModule mod_fcgid.c>
        <Directory "/srv/www/vhosts/projects.zoidtechnologies.com/html/">
            Options +ExecCGI -Indexes
            AllowOverride All
            AddHandler fcgid-script .php
            FCGIWrapper /srv/www/fcgid-php-wrapper .php
            FCGIWrapper /srv/www/fcgid-prg-wrapper .prg
            Require all granted
        </Directory>
    </IfModule>
</VirtualHost>

<IfModule mod_ssl.c>
    <VirtualHost *:443>
        ServerName projects.zoidtechnologies.com
        DocumentRoot "/srv/www/vhosts/projects.zoidtechnologies.com/html/"

        SSLEngine on
        SSLCertificateFile /etc/letsencrypt/live/projects.zoidtechnologies.com/fullchain.pem
        SSLCertificateKeyFile /etc/letsencrypt/live/projects.zoidtechnologies.com/privkey.pem

        <IfModule mod_fcgid.c>
            <Directory "/srv/www/vhosts/projects.zoidtechnologies.com/html/">
                Options +ExecCGI -Indexes
                AllowOverride All
                AddHandler fcgid-script .php
                FCGIWrapper /srv/www/fcgid-php-wrapper .php
                FCGIWrapper /srv/www/fcgid-prg-wrapper .prg
                Require all granted
            </Directory>
        </IfModule>
    </VirtualHost>
</IfModule>