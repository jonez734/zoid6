[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zoid6"
dynamic = ["version"]
description = "Unified BBS module router for zoid6"
requires-python = ">=3.9,<3.13"
dependencies = [
    "bbsengine6",
    "bed>=0.0.1.dev2026",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["zoid6*"]

[tool.setuptools]
script-files = [
    "bin/zoid6",
    "bin/zoid6-ping",
] 

[tool.setuptools.dynamic]
version = { attr = "zoid6._version.__version__" }

[tool.setuptools.package-data]
zoid6 = ["data/*.json", "daemon/*.tmpfiles"]

[tool.pytest.ini_options]
markers = [
    "integration: marks integration tests (require sibling packages on sys.path)",
]
