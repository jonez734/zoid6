[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zoid6"
version = "0.1.0"
description = "Unified BBS module router for zoid6"
requires-python = ">=3.9"
dependencies = [
    "bbsengine6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["zoid6*"]

[tool.setuptools.package-data]
zoid6 = ["data/*.json"]
